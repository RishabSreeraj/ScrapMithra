    @keyframes countUp { from{opacity:0;transform:translateY(10px)} to{opacity:1;transform:translateY(0)} }

    .demo-badge { background: linear-gradient(90deg, #16a34a, #22c55e); }

<style id="scrapmithra-footer-repair">

  display:block; width:100%; background:#111827!important; color:#d1d5db;

}

// ============================================================

// Shared service layer. Replace individual implementations with API calls
// later without changing the Mithra UI.
const scrapRateService = {
  getAll: () => SCRAP_RATES,
  find: (query) => {
    const q = String(query || '').trim().toLowerCase();
    return SCRAP_RATES.filter(r =>
      r.name.toLowerCase().includes(q) || r.category.toLowerCase().includes(q)
    );
  },
  getByName: (name) => SCRAP_RATES.find(r => r.name.toLowerCase() === String(name || '').toLowerCase())
};

const calculatorService = {
  estimate: (material, quantity) => {
    const rate = scrapRateService.getByName(material);
    const qty = Number(quantity) || 0;
    return rate ? { rate, quantity: qty, total: rate.price * qty } : null;
  }
};

const pickupService = {
  getAll: () => MOCK_PICKUPS,
  getById: (id) => MOCK_PICKUPS.find(p => p.id.toLowerCase() === String(id || '').toLowerCase()),
  getActive: () => MOCK_PICKUPS.filter(p => p.status !== 'Completed')
};

const collectorService = {
  getAvailable: (material) => {
    const available = MOCK_COLLECTORS.filter(c => c.available);
    if (!material) return available;
    const q = String(material).toLowerCase();
    return available.filter(c => c.materials.some(m => m.toLowerCase().includes(q)));
  }
};

const paymentService = {
  estimate: (items) => (items || []).reduce((sum, item) => {
    const rate = scrapRateService.getByName(item.name);
    return sum + (rate ? rate.price * (Number(item.qty) || 0) : 0);
  }, 0),
  explain: (pickup) => {
    if (!pickup) return 'Your final payment is based on the digitally verified weight multiplied by the applicable ScrapMithra rate. The displayed estimate is indicative.';
    const total = paymentService.estimate(pickup.scrap);
    return `For ${pickup.id}, the current estimate is ₹${total.toLocaleString('en-IN')}. The final amount is confirmed after digital weighing and material inspection.`;
  }
};

const environmentalImpactService = {
  calculate: (material, quantity) => {
    const category = SCRAP_RATES.find(r => r.name.toLowerCase() === String(material || '').toLowerCase())?.category || material;
    const eco = ECO_RATES[category] || ECO_RATES.Other;
    const qty = Number(quantity) || 0;
    return {
      category,
      quantity: qty,
      co2: (eco.co2 * qty).toFixed(1),
      water: (eco.water * qty).toFixed(0),
      energy: (eco.energy * qty).toFixed(1),
      trees: (eco.trees * qty).toFixed(2)
    };
  }
};

const faqService = {
  search: (query) => {
    const q = String(query || '').toLowerCase();
    return FAQS.filter(f => f.q.toLowerCase().includes(q) || f.a.toLowerCase().includes(q));
  }
};

const locationService = {
  getSupportedLocations: () => LOCATIONS
};

const notificationService = {
  getRecent: () => [
    { icon:'🎉', text:'Your pickup SM-2026-001245 is confirmed!', time:'2 min ago', read:false },
    { icon:'🚛', text:'Collector Arun is on the way.', time:'15 min ago', read:false },
    { icon:'📈', text:'Copper rate increased by 2.4% today.', time:'1 hr ago', read:true },
    { icon:'✅', text:'₹690 paid for pickup SM-2026-001198.', time:'Yesterday', read:true }
  ]
};

const mithraFormatMoney = (n) => `₹${Number(n || 0).toLocaleString('en-IN')}`;

const mithraFindMaterial = (text) => {
  const q = String(text || '').toLowerCase();
  const exact = SCRAP_RATES
    .slice()
    .sort((a,b) => b.name.length - a.name.length)
    .find(r => q.includes(r.name.toLowerCase()));
  if (exact) return exact;

  const aliases = [
    ['bottle','PET Bottles'], ['pet','PET Bottles'],
    ['newspaper','Newspaper'], ['news paper','Newspaper'],
    ['book','Books & Magazines'], ['magazine','Books & Magazines'],
    ['carton','Carton Boxes'], ['box','Corrugated Cardboard'],
    ['aluminium','Aluminium'], ['aluminum','Aluminium'],
    ['copper','Copper'], ['wire','Cables & Wires'],
    ['phone','Smartphone'], ['mobile','Smartphone'],
    ['laptop','Laptop'], ['computer','Desktop CPU'],
    ['fridge','Refrigerator'], ['refrigerator','Refrigerator'],
    ['washing machine','Washing Machine'], ['microwave','Microwave'],
    ['fan','Ceiling Fan'], ['air conditioner','Air Conditioner'],
    ['plastic','Mixed Plastic'], ['paper','Office Paper'],
    ['cardboard','Corrugated Cardboard'], ['iron','Iron'], ['steel','Steel'],
    ['brass','Brass'], ['lead','Lead'], ['printer','Printer'],
    ['glass','Glass Bottles'], ['rubber','Rubber'], ['battery','Battery']
  ];
  const match = aliases.find(([alias]) => q.includes(alias));
  return match ? scrapRateService.getByName(match[1]) : null;
};

const mithraExtractQuantity = (text) => {
  const match = String(text || '').match(/(\d+(?:\.\d+)?)\s*(?:kg|kgs|kilo|kilos|piece|pieces|pc|pcs)?/i);
  return match ? parseFloat(match[1]) : null;
};

const MithraAI = ({ setPage, isLoggedIn, userRole }) => {
  const [open, setOpen] = useState(false);
  const [input, setInput] = useState('');
  const [typing, setTyping] = useState(false);

  useEffect(() => {
    const openMithra = () => setOpen(true);
    window.addEventListener('open-mithra-ai', openMithra);
    return () => window.removeEventListener('open-mithra-ai', openMithra);
  }, []);
  const [messages, setMessages] = useState([
    {
      role:'bot',
      text:"Hi! I'm Mithra AI 🤖 — your intelligent scrap-recycling assistant. I can check ScrapMithra rates, estimate value, find collectors, explain payments, track pickups and show your recycling impact.",
      actions:[
        {label:'Check rates', action:'rates'},
        {label:'Calculate value', action:'calculate'},
        {label:'Book a pickup', action:'booking'},
        {label:'Track pickup', action:'tracking'}
      ]
    }
  ]);
  const endRef = useRef(null);

  useEffect(() => {
    if (open) endRef.current?.scrollIntoView({ behavior:'smooth' });
  }, [messages, typing, open]);

  const navigate = (page) => {
    setOpen(false);
    setPage(page);
  };

  const answer = useCallback((raw) => {
    const text = String(raw || '').trim();
    const q = text.toLowerCase();

    if (!text) return { text:'Tell me what you want to know about your scrap, rates, pickup or payment.' };

    if (q.includes('hello') || q.includes('hi') || q.includes('hey')) {
      return {
        text:"Hello! 👋 I'm Mithra. What can I help you with today?",
        actions:[
          {label:'Check scrap rates', action:'rates'},
          {label:'Calculate scrap value', action:'calculate'},
          {label:'Book pickup', action:'booking'}
        ]
      };
    }

    if (q.includes('notification') || q.includes('alert') || q.includes('update')) {
      const n = notificationService.getRecent()[0];
      return { text:`Your latest ScrapMithra notification is: ${n.text} (${n.time}).` };
    }

    if (q.includes('location') || q.includes('area') || q.includes('city') || q.includes('where do you operate')) {
      return { text:`ScrapMithra currently lists service locations including ${locationService.getSupportedLocations().join(', ')}. Availability can vary by pickup area.` };
    }

    if (q.includes('identify') || q.includes('what is this scrap') || q.includes('which scrap')) {
      const material = mithraFindMaterial(q);
      if (material) {
        return { text:`Based on the material name in your message, I'd classify it as ${material.category}: ${material.name}. The indicative rate is ${mithraFormatMoney(material.price)}/${material.unit}.` };
      }
      return { text:"Tell me the scrap item (for example, bottle, newspaper, copper wire, laptop, cardboard or aluminium) and I’ll map it to a ScrapMithra category and rate." };
    }

    if (q.includes('support') || q.includes('complaint') || q.includes('issue') || q.includes('help me')) {
      return {
        text:"I'm happy to help. For an issue that needs a human, you can contact ScrapMithra support at support@scrapmithra.in or use the support/contact option. I can also help you with rates, pickup status and payment questions.",
        actions:[{label:'Open About & Support', action:'about'}]
      };
    }

    if (q.includes('bulk') || q.includes('business') || q.includes('office') || q.includes('factory')) {
      return {
        text:"Yes. ScrapMithra supports residential and commercial pickups, including bulk or recurring collections. For a customized bulk arrangement, contact support@scrapmithra.in.",
        actions:[{label:'Contact support', action:'about'},{label:'Book pickup', action:'booking'}]
      };
    }

    if (q.includes('rate') || q.includes('price') || q.includes('cost') || q.includes('today')) {
      const material = mithraFindMaterial(q);
      if (material) {
        return {
          text:`The current ScrapMithra indicative rate for ${material.name} is ${mithraFormatMoney(material.price)}/${material.unit}. It is in the ${material.category} category and is ${material.changeDir === 'up' ? 'up' : material.changeDir === 'down' ? 'down' : 'stable'} by ${material.changePercentage}% today.`,
          actions:[{label:'Calculate this value', action:`calculate:${material.name}`}]
        };
      }
      const top = ['Copper','Aluminium','Iron','PET Bottles'].map(n => scrapRateService.getByName(n)).filter(Boolean);
      return {
        text:`I use the same ScrapMithra rate data shown on the Rates page. For example: ${top.map(r => `${r.name} ${mithraFormatMoney(r.price)}/${r.unit}`).join(' • ')}. Ask me for any material by name.`,
        actions:[{label:'View all rates', action:'rates'}]
      };
    }

    if (q.includes('calculate') || q.includes('estimate') || q.includes('worth') || q.includes('value') || (mithraFindMaterial(q) && mithraExtractQuantity(q))) {
      const material = mithraFindMaterial(q);
      const qty = mithraExtractQuantity(q);
      if (material && qty) {
        const result = calculatorService.estimate(material.name, qty);
        return {
          text:`Estimated value: ${qty} ${material.unit} of ${material.name} × ${mithraFormatMoney(material.price)}/${material.unit} = ${mithraFormatMoney(result.total)}. This is an estimate; the final amount is confirmed after inspection and digital weighing.`,
          actions:[{label:'Book pickup', action:'booking'},{label:'Find collector', action:`collectors:${material.name}`}]
        };
      }
      return {
        text:"Sure. Tell me the material and quantity, for example: “5 kg PET Bottles” or “3 kg Copper”. I'll calculate it using the same ScrapMithra rate data.",
        actions:[{label:'Open calculator', action:'home'}]
      };
    }

    if (q.includes('collector') || q.includes('kabadi') || q.includes('nearby') || q.includes('available')) {
      const material = mithraFindMaterial(q);
      const collectors = collectorService.getAvailable(material?.category || material?.name);
      const list = collectors.length ? collectors.slice(0,3).map(c => `${c.name} (${c.rating}★, ${c.distance})`).join(' • ') : 'No matching available collector is currently shown in the demo data.';
      return {
        text:`Available collectors${material ? ` for ${material.name}` : ''}: ${list}`,
        actions:[{label:'Book a pickup', action:'booking'}]
      };
    }

    if (q.includes('track') || q.includes('status') || q.includes('pickup') || q.includes('booking id') || q.includes('where is')) {
      const idMatch = text.match(/SM-\d{4}-\d+/i);
      const pickup = idMatch ? pickupService.getById(idMatch[0]) : pickupService.getActive()[0];
      if (pickup) {
        const collector = MOCK_COLLECTORS.find(c => c.name === pickup.collector);
        return {
          text:`Pickup ${pickup.id} is currently ${pickup.status}. Collector: ${pickup.collector}${collector ? ` • ${collector.distance} away` : ''}. Slot: ${pickup.time}.`,
          actions:[{label:'Open tracking', action:'tracking'},{label:'View pickup details', action:'dashboard'}]
        };
      }
      return { text:'I could not find an active pickup in the current ScrapMithra data. If you have a Booking ID, send it like SM-2026-001245.' };
    }

    if (q.includes('payment') || q.includes('paid') || q.includes('money') || q.includes('upi') || q.includes('cash') || q.includes('bank')) {
      const pickup = pickupService.getAll()[0];
      return {
        text:`${paymentService.explain(pickup)} ScrapMithra supports UPI, cash on the spot, or direct bank transfer. The estimate is not the final payment until weighing is completed.`,
        actions:[{label:'Open dashboard', action:'dashboard'}]
      };
    }

    if (q.includes('environment') || q.includes('impact') || q.includes('co2') || q.includes('carbon') || q.includes('water') || q.includes('tree')) {
      const material = mithraFindMaterial(q);
      const qty = mithraExtractQuantity(q);
      if (material && qty) {
        const impact = environmentalImpactService.calculate(material.name, qty);
        return {
          text:`For ${qty} ${material.unit} of ${material.name}, the app's impact model estimates ${impact.co2} kg CO₂ avoided, ${Number(impact.water).toLocaleString('en-IN')} L water saved and ${impact.energy} kWh energy saved${Number(impact.trees) > 0 ? `, equivalent to ${impact.trees} trees` : ''}.`,
          actions:[{label:'See full impact', action:'impact'}]
        };
      }
      return {
        text:"I can estimate environmental impact using the same ECO_RATES used by ScrapMithra. Try “impact of 10 kg paper” or open the Impact page.",
        actions:[{label:'Open impact dashboard', action:'impact'}]
      };
    }

    if (q.includes('recycl') || q.includes('what happens') || q.includes('process')) {
      return {
        text:"Collected scrap is sorted, processed and sent to authorized recycling facilities. The goal is to return usable materials to the circular economy instead of sending them to landfills.",
        actions:[{label:'How ScrapMithra works', action:'howitworks'}]
      };
    }

    const faq = faqService.search(q)[0];
    if (faq) return { text:faq.a };

    const category = CATEGORIES.find(c => c !== 'All' && q.includes(c.toLowerCase()));
    if (category) {
      const items = scrapRateService.getAll().filter(r => r.category === category).slice(0,5);
      return {
        text:`${category} includes ${items.map(r => `${r.name} (${mithraFormatMoney(r.price)}/${r.unit})`).join(', ')}.`,
        actions:[{label:'View all rates', action:'rates'},{label:'Calculate value', action:'calculate'}]
      };
    }

    return {
      text:"I can help with ScrapMithra rates, scrap identification/categories, value estimates, pickup booking and tracking, collectors, digital weighing, payment, recycling and environmental impact. Try asking “What is the rate for copper?”, “5 kg plastic worth?”, or “Track my pickup”.",
      actions:[
        {label:'Check rates', action:'rates'},
        {label:'Calculate value', action:'calculate'},
        {label:'Book pickup', action:'booking'},
        {label:'Track pickup', action:'tracking'}
      ]
    };
  }, []);

  const runAction = (action) => {
    if (action === 'rates') return navigate('rates');
    if (action === 'booking') return navigate('booking');
    if (action === 'tracking') return navigate('tracking');
    if (action === 'dashboard') return navigate('dashboard');
    if (action === 'impact') return navigate('impact');
    if (action === 'howitworks') return navigate('howitworks');
    if (action === 'about') return navigate('about');
    if (action === 'home') return navigate('home');

    if (action.startsWith('calculate:')) {
      const material = action.split(':')[1];
      setInput(`Calculate ${material} `);
      return;
    }
    if (action.startsWith('collectors:')) {
      const material = action.split(':')[1];
      const result = answer(`available collectors for ${material}`);

// ANIMATED COUNTER
// ─────────────────────────────────────────────
const AnimatedCounter = ({ target, prefix='', suffix='', duration=2000 }) => {
  const [count, setCount] = useState(0);
  const ref = useRef(null);
  const animated = useRef(false);

  useEffect(() => {
    const observer = new IntersectionObserver((entries) => {
      if (entries[0].isIntersecting && !animated.current) {
        animated.current = true;
        const start = Date.now();
        const timer = setInterval(() => {
          const elapsed = Date.now() - start;
          const progress = Math.min(elapsed / duration, 1);
          const eased = 1 - Math.pow(1 - progress, 3);
          setCount(Math.floor(eased * target));
          if (progress >= 1) clearInterval(timer);
        }, 16);
      }
    }, { threshold: 0.3 });
    if (ref.current) observer.observe(ref.current);
    return () => observer.disconnect();
  }, [target, duration]);

  return <span ref={ref}>{prefix}{count.toLocaleString('en-IN')}{suffix}</span>;
};

  const [rates, setRates] = useState(SCRAP_RATES.map(r => ({...r, active:true})));
  const [editingRate, setEditingRate] = useState(null);
  const [newPrice, setNewPrice] = useState('');

  const adminStats = [
    { icon:'👥', label:'Total Customers', value:'8,420', change:'+12%', color:'#dbeafe', textColor:'#2563eb' },
    { icon:'🚛', label:'Active Collectors', value:'320', change:'+5%', color:'#dcfce7', textColor:'#16a34a' },
    { icon:'📦', label:'Total Pickups', value:'24,680', change:'+18%', color:'#ede9fe', textColor:'#7c3aed' },
    { icon:'💰', label:'Total Transactions', value:'₹68.4L', change:'+22%', color:'#fef9c3', textColor:'#ca8a04' },
  ];

  const handleUpdateRate = () => {
    const nextPrice = parseFloat(newPrice) || editingRate.price;
    const sharedRate = SCRAP_RATES.find(r => r.id === editingRate.id);

// ─────────────────────────────────────────────
// MAIN APP
// ─────────────────────────────────────────────
const App = () => {
  const [currentPage, setCurrentPage] = useState('home');
  const [isLoggedIn, setIsLoggedIn] = useState(false);
  const [userRole, setUserRole] = useState('customer');

  const setPage = (page) => {
    setCurrentPage(page);
    window.scrollTo({ top: 0, behavior: 'smooth' });
  };

  const renderPage = () => {
    switch(currentPage) {
      case 'home': return <HomePage setPage={setPage} />;
      case 'rates': return <RatesPage setPage={setPage} />;
      case 'booking': return <BookingPage setPage={setPage} />;
      case 'tracking': return <TrackingPage setPage={setPage} />;
      case 'dashboard': return <CustomerDashboard setPage={setPage} />;
      case 'collector': return <CollectorDashboard setPage={setPage} />;
      case 'admin': return <AdminDashboard setPage={setPage} />;
      case 'services': return <ServicesPage setPage={setPage} />;
      case 'howitworks': return <HowItWorksPage setPage={setPage} />;
      case 'impact': return <ImpactPage setPage={setPage} />;
      case 'about': return <AboutPage setPage={setPage} />;
      case 'login': return <LoginPage setPage={setPage} setIsLoggedIn={setIsLoggedIn} setUserRole={setUserRole} />;
      default: return <HomePage setPage={setPage} />;
    }
  };

  return (
    <div className="min-h-screen">
      <DemoBanner />
      <Navbar currentPage={currentPage} setPage={setPage} isLoggedIn={isLoggedIn} setIsLoggedIn={setIsLoggedIn} userRole={userRole} setUserRole={setUserRole} />
      <main className="pb-20 md:pb-0">
        {renderPage()}
      </main>
      {currentPage !== 'login' && <Footer setPage={setPage} />}
      {currentPage !== 'login' && <MithraAI setPage={setPage} isLoggedIn={isLoggedIn} userRole={userRole} />}
      <MobileBottomNav currentPage={currentPage} setPage={setPage} />
    </div>
  );
};

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
